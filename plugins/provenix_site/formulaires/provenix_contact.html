<div id="contact-form" class="contact-form formulaire_spip formulaire_provenix_contact">
  <h3>[(#VAL{contact_014}|provenix_texte)]</h3>
  <p>[(#VAL{contact_015}|provenix_texte)]</p>
  [<p class="reponse_formulaire reponse_formulaire_ok" role="status" tabindex="-1" autofocus>(#ENV*{message_ok})</p>]
  [<p class="reponse_formulaire reponse_formulaire_erreur" role="alert" tabindex="-1" autofocus>(#ENV*{message_erreur})</p>]
  [(#ENV{editable}|oui)
  <form id="contact-message-form" action="#ENV{action}#contact-form" method="post">
    #ACTION_FORMULAIRE
    <input type="hidden" name="contact_ticket" value="#ENV{contact_ticket}">
    <div class="contact-honeypot" aria-hidden="true">
      <label for="contact-website">[(#VAL{contact_honeypot}|provenix_texte)]</label>
      <input id="contact-website" name="contact_website" tabindex="-1" autocomplete="off" value="">
    </div>
    <div class="form-row">
      <label for="contact-name">[(#VAL{contact_016}|provenix_texte)]
        <input id="contact-name" name="contact_name" autocomplete="name" required maxlength="100"
          value="#ENV{contact_name}" placeholder="[(#VAL{contact_017}|provenix_texte)]"
          aria-invalid="[(#ENV{erreurs/contact_name}|?{true,false})]"[ aria-describedby="contact-name-error"(#ENV{erreurs/contact_name}|oui)]>
        [<span id="contact-name-error" class="field-error">(#ENV{erreurs/contact_name})</span>]
      </label>
      <label for="contact-email">[(#VAL{contact_018}|provenix_texte)]
        <input id="contact-email" name="contact_email" type="email" autocomplete="email" required maxlength="200"
          value="#ENV{contact_email}" placeholder="[(#VAL{contact_019}|provenix_texte)]"
          aria-invalid="[(#ENV{erreurs/contact_email}|?{true,false})]"[ aria-describedby="contact-email-error"(#ENV{erreurs/contact_email}|oui)]>
        [<span id="contact-email-error" class="field-error">(#ENV{erreurs/contact_email})</span>]
      </label>
    </div>
    <label for="contact-company">[(#VAL{contact_020}|provenix_texte)]<span class="optional">[(#VAL{contact_021}|provenix_texte)]</span>
      <input id="contact-company" name="contact_company" autocomplete="organization" maxlength="160"
        value="#ENV{contact_company}" placeholder="[(#VAL{contact_022}|provenix_texte)]"
        aria-invalid="[(#ENV{erreurs/contact_company}|?{true,false})]"[ aria-describedby="contact-company-error"(#ENV{erreurs/contact_company}|oui)]>
      [<span id="contact-company-error" class="field-error">(#ENV{erreurs/contact_company})</span>]
    </label>
    <label for="contact-topic">[(#VAL{contact_023}|provenix_texte)]
      <select id="contact-topic" name="contact_topic" aria-invalid="[(#ENV{erreurs/contact_topic}|?{true,false})]"[ aria-describedby="contact-topic-error"(#ENV{erreurs/contact_topic}|oui)]>
        <BOUCLE_topics(DATA){source tableau,#ENV{topics}}>
          <option value="#CLE"[(#CLE|=={#ENV{contact_topic}}|oui) selected]>[(#VALEUR|provenix_texte)]</option>
        </BOUCLE_topics>
      </select>
      [<span id="contact-topic-error" class="field-error">(#ENV{erreurs/contact_topic})</span>]
    </label>
    <label for="contact-message">[(#VAL{contact_028}|provenix_texte)]
      <textarea id="contact-message" name="contact_message" required minlength="10" maxlength="4000" rows="5"
        placeholder="[(#VAL{contact_029}|provenix_texte)]"
        aria-invalid="[(#ENV{erreurs/contact_message}|?{true,false})]"[ aria-describedby="contact-message-error"(#ENV{erreurs/contact_message}|oui)]>#ENV{contact_message}</textarea>
      [<span id="contact-message-error" class="field-error">(#ENV{erreurs/contact_message})</span>]
    </label>
    <button class="button" type="submit">[(#VAL{contact_030}|provenix_texte)] <span><INCLURE{fond=inc-icon,direction=up-right}></span></button>
    <p class="form-note">[(#VAL{contact_031}|provenix_texte)]</p>
  </form>
  ]
</div>
